components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived (`15m`) HMAC-SHA256 JWT carrying `sub`, `email`, `role` (`Customer` | `DealerStaff` | `Admin`),
        `dealer_id` (mandatory for `DealerStaff`), and `permissions` array. For SignalR `/hubs/notifications`,
        passed via `?access_token={jwt}` handshake query parameter.

  parameters:
    DealerIdPath:
      name: dealerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelIdPath:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VehicleIdPath:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingIdPath:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PageNumberQuery:
      name: pageNumber
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeQuery:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 120
      description: Optional client idempotency key preventing duplicate mutations on network timeout retries.
    AnalyticsFromUtcQuery:
      name: fromUtc
      in: query
      required: false
      schema:
        type: string
        format: date-time
    AnalyticsToUtcQuery:
      name: toUtc
      in: query
      required: false
      schema:
        type: string
        format: date-time
    AnalyticsDealerFilterQuery:
      name: dealerId
      in: query
      required: false
      schema:
        type: string
        format: uuid

  responses:
    ValidationFailed400:
      description: Request failed FluentValidation input rules (`VALIDATION_FAILED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblemDetails'
    Unauthorized401:
      description: Missing, expired, or invalid JWT / RefreshToken (`UNAUTHORIZED` | `TOKEN_EXPIRED` | `INVALID_REFRESH_TOKEN`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Forbidden403:
      description: Caller lacks required permission, dealer scope, or resource ownership (`FORBIDDEN_PERMISSION` | `FORBIDDEN_DEALER_SCOPE` | `FORBIDDEN_RESOURCE_OWNER`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound404:
      description: Target resource does not exist or is masked by `IDealerScoped` query filter (`RESOURCE_NOT_FOUND`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Conflict409:
      description: Optimistic concurrency `RowVersion` mismatch, exhausted slot capacity, or duplicate unique key (`CONCURRENCY_CONFLICT` | `SLOT_CAPACITY_EXHAUSTED` | `DUPLICATE_VIN` | `INVOICE_ALREADY_ISSUED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    Unprocessable422:
      description: Domain invariant rejected syntactically valid request (`INSUFFICIENT_LOYALTY_POINTS` | `VOUCHER_INELIGIBLE` | `ODOMETER_REGRESSION` | `INVALID_STATUS_TRANSITION`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    RateLimited429:
      description: Endpoint rate-limit policy exceeded (`RATE_LIMIT_EXCEEDED`).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    VinString:
      type: string
      minLength: 17
      maxLength: 17
      pattern: '^[A-HJ-NPR-Z0-9]{17}$'
      description: ISO 3779 17-character uppercase alphanumeric Vehicle Identification Number (excluding I, O, Q).
      examples:
        - RLHJF5109RZ104829

    MoneyVnd:
      type: number
      minimum: 0
      description: Exact `DECIMAL(18,2)` monetary amount in Vietnamese Dong (VND); never float/double in C# or SQL.
      examples:
        - 830000.00
        - 101000000.00

    RowVersionToken:
      type: string
      contentEncoding: base64
      description: Base64-encoded 8-byte SQL Server `ROWVERSION` optimistic concurrency token.
      examples:
        - AAAAAAAAD4F=

    RoleName:
      type: string
      enum: [Customer, DealerStaff, Admin]

    CanonicalPermissionCode:
