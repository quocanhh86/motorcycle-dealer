openapi: 3.1.0
info:
  title: Motorcycle Dealer & Loyalty Management Platform API
  version: 1.2.0
  summary: >-
    Canonical OpenAPI 3.1.0 REST & Real-Time Webhook Contract for Multi-Dealer Motorcycle Retail,
    Showroom Test-Drive Scheduling, VIN Garage Tracking, Concurrency-Safe Workshop Slot Booking,
    OEM Spare-Parts Itemized Invoicing, Post-Service 5-Star CSAT Reviews, VIN Warranty Claims,
    Printable Verification Receipts, Immutable Tiered Loyalty Ledger, SignalR Notifications, and Executive Analytics.
  description: |
    Authoritative HTTP/JSON contract for `MotorcycleDealer.WebApi` (**ASP.NET Core 10**, Clean Architecture).

    ### Core Engineering Guarantees
    - **Granular RBAC (`FR-01`, `ADR-002`)**: 3 canonical roles (`Customer`, `DealerStaff`, `Admin`) enforced by 48 `Permissions.<Module>.<Action>` policies (`x-required-permission`) and EF Core `IDealerScoped` Global Query Filters (`DealerId == currentUser.DealerId` for `DealerStaff` across 8 scoped tables).
    - **ISO 3779 VIN Integrity (`FR-02`, `FR-03`)**: All vehicle identification numbers enforce `^[A-HJ-NPR-Z0-9]{17}$` (excluding `I`, `O`, `Q`).
    - **Optimistic Concurrency (`FR-04`, `ADR-005`)**: `RowVersion` Base64 tokens guard `DealerInventories`, `ServiceTimeSlots`, `ServiceBookings`, `TestDriveBookings`, `ServiceReviews`, `WarrantyClaims`, `LoyaltyAccounts`, and `CustomerVouchers`, returning `409 Conflict` (`application/problem+json`) on contention.
    - **Immutable Loyalty Ledger & Line-Item Audit (`FR-05`, `FR-09`, `ADR-003`)**: Append-only `PointLedgerEntries` and `ServiceInvoiceLineItems` with two-step floor accrual `Floor(Floor(NetPaidAmount / 10000) * TierMultiplier)` across `Bronze` (`1.00x`), `Silver` (`1.20x`), `Gold` (`1.50x`), and `Platinum` (`2.00x`), `+25` spendable `ServiceReviewBonus` (`AvailablePoints` ONLY), and SHA-256 verified printable receipts (`RCP-SLS-*` / `RCP-SVC-*`).
    - **RFC 7807 Error Contract**: Every `4xx`/`5xx` response returns `application/problem+json` with `errorCode` and W3C `traceId`.
  contact:
    name: Full-Stack Platform Engineering
    url: https://github.com/quocanhh86/motorcycle-dealer
  license:
    name: Portfolio Specification Contract
    identifier: MIT
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base

servers:
  - url: http://localhost:5080
    description: Local Development & Smoke-Test Kestrel Server (.NET 10 WebApi + SignalR Hub)
  - url: https://localhost:7080
    description: Local HTTPS Development Endpoint
  - url: http://localhost:8080
    description: Docker Compose Reverse-Proxy / Container Gateway

tags:
  - name: Health
    description: Liveness, readiness, and SQL Server connectivity probes.
  - name: Auth
    description: Customer registration, JWT Bearer issuance, rotating RefreshTokens, and principal introspection (`FR-01`).
  - name: Dealers
    description: Authorized dealership locator, branch administration, and `DealerStaff` provisioning (`FR-01`, `FR-02`).
  - name: Motorcycles
    description: Showroom motorcycle model catalog and OEM `MaintenanceRules` schedules (`FR-02`, `FR-03`).
  - name: Inventories
    description: Dealer-scoped 17-character ISO 3779 `VIN` showroom stock management (`FR-02`, `IDealerScoped`).
  - name: SalesOrders
    description: Atomic showroom bike sales, `VIN` garage onboarding, and purchase point accrual (`FR-02`, `FR-05`).
  - name: Vehicles
    description: Customer digital `VIN` garage, external `VIN` registration, odometer tracking, and `MaintenanceReminders` (`FR-03`, `FR-04`).
  - name: TimeSlots
    description: Workshop bay capacity schedules (`ServiceTimeSlots`) guarded by `RowVersion` (`FR-04`).
  - name: Bookings
    description: Concurrency-safe maintenance appointments, voucher reservation, status lifecycle, and instant SignalR push (`FR-04`, `FR-06`).
  - name: ServiceInvoices
    description: Workshop settlement, voucher consumption, odometer rollforward, and loyalty/tier engine execution (`FR-04`, `FR-05`).
  - name: Loyalty
    description: Tier progress (`Bronze`..`Platinum`), immutable `PointLedgerEntries` audit log, and manual point adjustments (`FR-05`).
  - name: Vouchers
    description: "`VoucherCatalogs` reward store and `CustomerVouchers` point redemption (`FR-05`)."
  - name: Notifications
    description: Persistent inbox backing `/hubs/notifications` real-time SignalR streams (`FR-06`).
  - name: AdminAnalytics
    description: Cross-dealer `Chart.js v4` revenue, booking funnel, monthly trend, and tier distribution aggregations (`FR-07`).
  - name: TestDrives
    description: Showroom test-drive scheduling, concurrency window cap (`<= 2`), demo `VIN` assignment, and live SignalR alerts (`T-802`).
  - name: SpareParts
    description: Genuine OEM spare-parts catalog (`SpareParts`) and compatibility-filtered workshop itemization (`T-803`).
  - name: ServiceReviews
    description: Post-service 5-star CSAT feedback (`ServiceReviews`), `+25` spendable `ServiceReviewBonus` credit, and dealership responses (`T-902`).
  - name: WarrantyClaims
    description: 36-month / 30,000-km factory VIN warranty claims (`WarrantyClaims`) and live adjudication (`T-903`).

paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealthStatus
      summary: Check WebApi and SQL Server MotorcycleDealerDb readiness
      security: []
      responses:
        '200':
          description: Platform API and database are healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatusResponse'
        '503':
          description: Database or critical subsystem degraded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Register a new Customer account and initialize a Bronze LoyaltyAccount
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
      responses:
        '201':
          description: Customer registered with initial Bronze LoyaltyAccount.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed400'
        '409':
          $ref: '#/components/responses/Conflict409'
        '429':
          $ref: '#/components/responses/RateLimited429'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: Authenticate credentials and issue short-lived JWT + rotating RefreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '429':
          $ref: '#/components/responses/RateLimited429'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshAccessToken
      summary: Rotate RefreshToken and issue fresh JWT + permissions claims
      description: >-
        Validates SHA-256 `TokenHash`, rotates the token within `TokenFamilyId`, and revokes the entire
        token family immediately if replay of an already-rotated token is detected (`ADR-006`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token rotated cleanly.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized401'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: Revoke active RefreshToken family and terminate session
      security:
        - BearerAuth: []
      x-allowed-roles: [Customer, DealerStaff, Admin]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session terminated and refresh family revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperationAckEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized401'

  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUserProfile
      summary: Return authenticated principal profile, assigned DealerId, and 48-permission subset
      security:
        - BearerAuth: []
      x-allowed-roles: [Customer, DealerStaff, Admin]
      responses:
        '200':
          description: Current authenticated user context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized401'

  /api/v1/dealers:
    get:
      tags: [Dealers]
      operationId: listPublicDealers
      summary: List active dealerships nationwide with service hours and bay capacity
      security:
        - {}
        - BearerAuth: []
      x-required-permission: Permissions.Dealers.ViewPublic
      parameters:
        - name: city
          in: query
          schema:
            type: string
          description: Optional municipality filter (`Hanoi`, `Da Nang`, `Ho Chi Minh City`).
      responses:
        '200':
          description: List of active dealerships.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerListEnvelope'
    post:
      tags: [Dealers]
      operationId: createDealer
      summary: Create a new authorized dealership branch (Admin)
      security:
        - BearerAuth: []
      x-required-permission: Permissions.Dealers.ManageAll
      x-allowed-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertDealerRequest'
      responses:
        '201':
          description: Dealership created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerDetailEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '409':
          $ref: '#/components/responses/Conflict409'

  /api/v1/dealers/{dealerId}:
    parameters:
      - $ref: '#/components/parameters/DealerIdPath'
    get:
      tags: [Dealers]
      operationId: getDealerById
      summary: Get single dealership details and showroom stock summary
      security:
        - {}
        - BearerAuth: []
      x-required-permission: Permissions.Dealers.ViewPublic
      responses:
        '200':
          description: Dealership details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerDetailEnvelope'
        '404':
          $ref: '#/components/responses/NotFound404'
    put:
      tags: [Dealers]
      operationId: updateDealer
      summary: Update dealership metadata, workshop hours, or active state (Admin)
      security:
        - BearerAuth: []
      x-required-permission: Permissions.Dealers.ManageAll
      x-allowed-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertDealerRequest'
      responses:
        '200':
          description: Dealership updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerDetailEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'

  /api/v1/dealers/{dealerId}/staff:
    parameters:
      - $ref: '#/components/parameters/DealerIdPath'
    get:
      tags: [Dealers]
      operationId: listDealerStaff
      summary: List DealerStaff accounts bound to a specific dealership (Admin)
      security:
        - BearerAuth: []
      x-required-permission: Permissions.Users.ManageStaff
      x-allowed-roles: [Admin]
      responses:
        '200':
          description: Staff accounts assigned to the dealer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerStaffListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
    post:
      tags: [Dealers]
      operationId: provisionDealerStaff
      summary: Provision a new DealerStaff account strictly scoped to {dealerId} (Admin)
      security:
        - BearerAuth: []
      x-required-permission: Permissions.Users.ManageStaff
      x-allowed-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDealerStaffRequest'
      responses:
        '201':
          description: DealerStaff user created and mapped to role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerStaffEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '409':
          $ref: '#/components/responses/Conflict409'

  /api/v1/dealers/{dealerId}/staff/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/DealerIdPath'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Dealers]
      operationId: updateDealerStaffStatus
      summary: Lock or unlock a DealerStaff account and revoke tokens if deactivated (Admin)
      security:
        - BearerAuth: []
      x-required-permission: Permissions.Users.ManageStaff
      x-allowed-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffStatusRequest'
      responses:
        '200':
          description: Staff active status updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerStaffEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'

  /api/v1/motorcycles:
    get:
      tags: [Motorcycles]
      operationId: listMotorcycles
      summary: Paginated showroom motorcycle catalog with per-dealer VIN stock counts
      security:
        - {}
        - BearerAuth: []
      x-required-permission: Permissions.Showroom.View
      parameters:
        - $ref: '#/components/parameters/PageNumberQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/MotorcycleCategory'
        - name: dealerId
          in: query
          schema:
            type: string
            format: uuid
          description: Filter available VIN count badge for a preferred dealership.
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Paginated motorcycle models.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMotorcycleModelEnvelope'
    post:
      tags: [Motorcycles]
      operationId: createMotorcycleModel
      summary: Create a new MotorcycleModels catalog entry (Admin)
      security:
        - BearerAuth: []
      x-required-permission: Permissions.Showroom.ManageModels
      x-allowed-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMotorcycleModelRequest'
      responses:
        '201':
          description: Motorcycle model created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotorcycleModelDetailEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '409':
          $ref: '#/components/responses/Conflict409'

  /api/v1/motorcycles/{modelId}:
    parameters:
      - $ref: '#/components/parameters/ModelIdPath'
    get:
      tags: [Motorcycles]
      operationId: getMotorcycleModelById
      summary: Detailed motorcycle specs, MSRP, OEM MaintenanceRules, and dealer stock breakdown
      security:
        - {}
        - BearerAuth: []
      x-required-permission: Permissions.Showroom.View
      responses:
        '200':
          description: Motorcycle model detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotorcycleModelDetailEnvelope'
        '404':
          $ref: '#/components/responses/NotFound404'
    put:
      tags: [Motorcycles]
      operationId: updateMotorcycleModel
      summary: Update motorcycle model specifications, warranty, or BaseRetailPrice (Admin)
      security:
        - BearerAuth: []
      x-required-permission: Permissions.Showroom.ManageModels
      x-allowed-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMotorcycleModelRequest'
      responses:
        '200':
          description: Model updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotorcycleModelDetailEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'

  /api/v1/motorcycles/{modelId}/maintenance-rules:
    parameters:
      - $ref: '#/components/parameters/ModelIdPath'
    get:
      tags: [Motorcycles]
      operationId: listModelMaintenanceRules
      summary: List OEM MaintenanceRules milestones (IntervalKm / IntervalMonths) for a model
      security:
        - {}
        - BearerAuth: []
      x-required-permission: Permissions.Showroom.View
      responses:
        '200':
          description: Ordered list of maintenance milestones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRuleListEnvelope'
        '404':
          $ref: '#/components/responses/NotFound404'
    post:
      tags: [Motorcycles]
      operationId: createMaintenanceRule
      summary: Add an OEM maintenance milestone rule to a motorcycle model (Admin)
      security:
        - BearerAuth: []
      x-required-permission: Permissions.Vehicles.ManageRules
      x-allowed-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMaintenanceRuleRequest'
      responses:
        '201':
          description: Maintenance rule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRuleEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'

  /api/v1/motorcycles/{modelId}/maintenance-rules/{ruleId}:
    parameters:
      - $ref: '#/components/parameters/ModelIdPath'
      - name: ruleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Motorcycles]
      operationId: updateMaintenanceRule
      summary: Update milestone IntervalKm, IntervalMonths, or ChecklistSummary (Admin)
      security:
        - BearerAuth: []
      x-required-permission: Permissions.Vehicles.ManageRules
      x-allowed-roles: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMaintenanceRuleRequest'
      responses:
        '200':
          description: Maintenance rule updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceRuleEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'

  /api/v1/inventories:
    get:
      tags: [Inventories]
      operationId: listDealerInventories
      summary: Paginated DealerInventories VIN stock (IDealerScoped for DealerStaff; cross-dealer for Admin)
      security:
        - BearerAuth: []
      x-required-permission: Permissions.Inventories.ViewDealer
      x-dealer-scoped: true
      parameters:
        - $ref: '#/components/parameters/PageNumberQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
        - name: dealerId
          in: query
          schema:
            type: string
            format: uuid
          description: Honored only for `Admin`; ignored/overridden by `currentUser.DealerId` for `DealerStaff`.
        - name: stockStatus
          in: query
          schema:
            $ref: '#/components/schemas/StockStatus'
        - name: vin
          in: query
          schema:
            type: string
            maxLength: 17
      responses:
        '200':
          description: Paginated dealer VIN stock records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDealerInventoryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
    post:
      tags: [Inventories]
      operationId: intakeDealerInventoryVin
      summary: Intake a physical 17-character ISO 3779 VIN unit into DealerInventories
      security:
        - BearerAuth: []
      x-required-permission: Permissions.Inventories.ManageDealer
      x-dealer-scoped: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDealerInventoryRequest'
      responses:
        '201':
          description: VIN unit added to showroom stock (`StockStatus = Available`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerInventoryEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '409':
          $ref: '#/components/responses/Conflict409'

  /api/v1/inventories/{inventoryId}:
    parameters:
      - name: inventoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Inventories]
      operationId: updateDealerInventoryStatus
      summary: Update DealerInventories StockStatus or ListedPrice guarded by RowVersion
      security:
        - BearerAuth: []
      x-required-permission: Permissions.Inventories.ManageDealer
      x-dealer-scoped: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDealerInventoryRequest'
      responses:
        '200':
          description: Inventory unit updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DealerInventoryEnvelope'
        '400':
          $ref: '#/components/responses/ValidationFailed400'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
        '404':
          $ref: '#/components/responses/NotFound404'
        '409':
          $ref: '#/components/responses/Conflict409'

  /api/v1/sales-orders:
    get:
      tags: [SalesOrders]
      operationId: listDealerSalesOrders
      summary: List showroom SalesOrders (IDealerScoped for DealerStaff; cross-dealer for Admin)
      security:
        - BearerAuth: []
      x-required-permission: Permissions.SalesOrders.ViewDealer
      x-dealer-scoped: true
      parameters:
        - $ref: '#/components/parameters/PageNumberQuery'
        - $ref: '#/components/parameters/PageSizeQuery'
        - name: dealerId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Paginated showroom sales orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedSalesOrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized401'
        '403':
          $ref: '#/components/responses/Forbidden403'
    post:
      tags: [SalesOrders]
      operationId: createSalesOrder
      summary: Complete atomic showroom bike sale -> mark VIN Sold + onboard CustomerVehicle + accrue Loyalty points
      security:
        - BearerAuth: []
      x-required-permission: Permissions.SalesOrders.Create
      x-dealer-scoped: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
